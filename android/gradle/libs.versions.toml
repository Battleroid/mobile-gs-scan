[versions]
agp = "8.7.2"
kotlin = "2.0.21"
coreKtx = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
# Compose BOM — pins every androidx.compose.* artifact together so
# bumping the BOM bumps the whole UI surface in lockstep. 2024.12.01
# is the latest stable at branch cut; tracks the same Kotlin 2.0.21
# compiler we already use, so no kotlinCompilerExtensionVersion churn.
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
arcore = "1.49.0"
okhttp = "4.12.0"
kotlinxCoroutines = "1.9.0"
kotlinxSerializationJson = "1.7.3"
preference = "1.2.1"
recyclerview = "1.3.2"
swiperefreshlayout = "1.1.0"
# Coil — Compose-friendly image loader. Used for static thumbnails
# everywhere (home capture rows, draft list, draft detail hero,
# capture/job detail hero). Includes coil-network-okhttp so it
# reuses the project's existing OkHttp dep for cache/timeout
# behavior instead of pulling in a second HTTP client.
coil = "2.7.0"
# androidx.webkit ships WebViewAssetLoader, the modern shim that lets
# the splat-viewer WebView load /android_asset/ pages + downloaded
# .spz files through a single virtual https:// origin. That's the
# escape hatch from `setAllowFileAccessFromFileURLs(true)`, which
# Chromium has been removing piecemeal since API 30.
androidxWebkit = "1.16.0"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
arcore = { group = "com.google.ar", name = "core", version.ref = "arcore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
# Compose — BOM-anchored. Individual artifacts list no version; BOM
# resolves them. activity-compose is the bridge from Android Activity
# into setContent { ... }; material3 carries the design tokens API
# we'll build PebbleTheme around; ui-tooling-preview lets @Preview
# composables render in Android Studio without dragging the full
# runtime tooling into the release APK.
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Compose compiler is a separate Kotlin plugin starting Kotlin 2.0;
# bound to the same kotlin version so the plugin and runtime never
# drift. Required wherever buildFeatures.compose = true.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
