<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>splat</title>
    <style>
      /* Pebble cream as fallback while viewer.bundle.js boots. The
         renderer overrides via ?bg= once it's online. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #fbf6ec;
        color: #1a1612;
        font-family: -apple-system, system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #root {
        position: fixed;
        inset: 0;
      }
      #root canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        touch-action: none;
      }
      /* "loading…" / error tag, top-center, sub-monospace. Removed
         once the splat finishes its first frame (the bundle clears
         status on success). */
      #status {
        position: fixed;
        left: 50%;
        top: 14px;
        transform: translateX(-50%);
        font-family: ui-monospace, "Geist Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #5c5347;
        background: rgba(255, 255, 255, 0.7);
        padding: 6px 10px;
        border-radius: 999px;
        pointer-events: none;
        z-index: 10;
      }
      #status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="status">starting…</div>
    <script src="./viewer.bundle.js"></script>
  </body>
</html>
