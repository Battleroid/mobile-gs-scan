# git-cliff config. Drives CHANGELOG.md generation on tag pushes.
# Conventional-commit aware: groups commits into Features / Fixes /
# Refactors / etc. by their type prefix; commits that don't match any
# group land under "Other".

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/);
versioning follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
This file is regenerated by `git-cliff` on every `v*` tag push — manual
edits get overwritten, so adjust the [git_log] filter or [git] commit_parsers
sections below if a category needs a different rendering.

"""

# Single tag's worth of content per release. Body is a Tera template;
# `commits` is the list inside the current release group.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\\n") | first | trim }}\
{% if commit.id %} ({{ commit.id | truncate(length=7, end="") }}){% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
# Drop Claude Code session URLs and trailer-style co-author lines from
# the rendered output — the bot footer adds noise to changelog entries.
commit_preprocessors = [
  { pattern = '\nhttps://claude.ai/code/[^\s]*', replace = "" },
  { pattern = '\n+_Generated by \[Claude Code\][^\n]*', replace = "" },
  { pattern = '\nCo-authored-by:[^\n]*', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactors" },
  { message = "^docs", group = "Docs" },
  { message = "^test", group = "Tests" },
  { message = "^chore", group = "Chores" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  # Catch-all for non-conventional commits — keeps them in the
  # changelog instead of silently dropping them.
  { message = ".*", group = "Other" },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
